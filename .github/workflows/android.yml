name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # The release step publishes the APK as a GitHub Release, which needs write
    # access to repository contents (the default token is read-only).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle provides `gradle` on PATH and handles dependency caching,
      # so the repository does not need to commit the (binary) wrapper jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      # Guards the bug that made every previous fix look ineffective: Android
      # refuses to install an update signed by a different certificate than the
      # installed app (INSTALL_FAILED_UPDATE_INCOMPATIBLE). If the shared debug
      # keystore is ever removed or replaced, the representative silently keeps
      # the old build and reports "still broken". Fail the build instead.
      - name: Verify APK signing certificate is the shared one
        run: |
          expected="3f39ef7fb8796ecc216c742f87aeeaf161f05d5ae214a60c9ba6b85a2ca55988"
          apksigner=$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)
          echo "using $apksigner"
          for apk in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            actual=$("$apksigner" verify --print-certs "$apk" | awk '/SHA-256 digest/ {print $NF; exit}')
            echo "$apk -> $actual"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$apk::APK is not signed with the shared key; updates will be rejected."
              exit 1
            fi
          done

      - name: Publish GitHub release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          TAG="v${VERSION_CODE}"
          if gh release view "$TAG" --repo melsofany/Rfq-Manager >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping."
          else
            gh release create "$TAG" "$APK" \
              --repo melsofany/Rfq-Manager \
              --title "${VERSION_NAME}" \
              --notes "تحديث تطبيق العمليات الميدانية ${VERSION_NAME}"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cortoba-field-ops-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cortoba-field-ops-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: cortoba-field-ops-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
