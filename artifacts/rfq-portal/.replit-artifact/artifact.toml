kind = "web"
previewPath = "/"
title = "RFQ Portal - قرطبة للتوريدات"
version = "1.0.0"
id = "artifacts/rfq-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20663

[services.development]
run = "pnpm --filter @workspace/rfq-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rfq-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/rfq-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20663"
BASE_PATH = "/"
