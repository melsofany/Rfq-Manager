    ErpIntegration:
      type: object
      required: [id, name, type, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
          description: "اسم التكامل (مثال: Odoo الإنتاج)"
        type:
          type: string
          enum: [odoo, sap-b1, sap-s4hana, oracle, google-sheets]
          description: "نوع نظام الـ ERP"
        config:
          type: object
          description: "إعدادات الاتصال (كلمات المرور مخفاة)"
          additionalProperties: true
        isActive:
          type: boolean
        lastSyncAt:
          type: ["string", "null"]
        lastSyncStatus:
          type: ["string", "null"]
          enum: [success, error, partial, null]
        lastSyncError:
          type: ["string", "null"]
        lastSyncStats:
          type: ["object", "null"]
          additionalProperties: true
        createdAt:
          type: string
        updatedAt:
          type: string

