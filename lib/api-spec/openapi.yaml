openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RFQ Management System API for Cortoba Supplies
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: rfq
    description: RFQ management
  - name: suppliers
    description: Supplier management
  - name: customers
    description: Customer management
  - name: customer-rfq
    description: Customer Request for Quotation intake
  - name: customer-po
    description: Customer purchase orders
  - name: offers
    description: Supplier offers/pricing
  - name: analytics
    description: Analytics and dashboards
  - name: audit
    description: Audit log
  - name: integrations
    description: "تكامل مع أنظمة ERP (Odoo · SAP · Oracle · Google Sheets)"

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Employee login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "401":
          description: Unauthorized

  # EMPLOYEES
  /employees:
    get:
      operationId: listEmployees
      tags: [auth]
      summary: List all employees
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [auth]
      summary: Create employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    patch:
      operationId: updateEmployee
      tags: [auth]
      summary: Update employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  # SUPPLIERS
  /categories:
    get:
      operationId: listCategories
      tags: [suppliers]
      summary: List supplier categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierCategory"
    post:
      operationId: createCategory
      tags: [suppliers]
      summary: Create supplier category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierCategory"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [suppliers]
      summary: Update supplier category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierCategory"
    delete:
      operationId: deleteCategory
      tags: [suppliers]
      summary: Delete supplier category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers with optional category filter
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/bulk:
    post:
      operationId: bulkImportSuppliers
      tags: [suppliers]
      summary: "استيراد موردين بالجملة"
      description: "إضافة عدة موردين دفعة واحدة مع تعيين التصنيف لكل منهم"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportSuppliersInput"
      responses:
        "200":
          description: نتيجة الاستيراد
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportSuppliersResult"

  /suppliers/scores:
    get:
      operationId: listSupplierScores
      tags: [suppliers]
      summary: "تقييمات جميع الموردين مرتبةً تنازلياً"
      responses:
        "200":
          description: قائمة تقييمات الموردين
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierScore"

  /suppliers/{id}/score:
    get:
      operationId: getSupplierScore
      tags: [suppliers]
      summary: Get supplier performance score
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierScore"

  # CUSTOMERS
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers with optional search
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete customer (admin/manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "409":
          description: Cannot delete (linked records exist)

  # CUSTOMER RFQ
  /customer-rfq:
    get:
      operationId: listCustomerRfqs
      tags: [customer-rfq]
      summary: List customer RFQs with optional search
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of customer RFQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerRfq"
    post:
      operationId: createCustomerRfq
      tags: [customer-rfq]
      summary: Create a customer RFQ (auto-generates number when blank)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRfqInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerRfq"

  /customer-rfq/numbers:
    get:
      operationId: listCustomerRfqNumbers
      tags: [customer-rfq]
      summary: List all customer RFQ numbers (for the supplier-RFQ import combobox)
      responses:
        "200":
          description: List of customer RFQ numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  rfqNumbers:
                    type: array
                    items:
                      type: string
                required: [rfqNumbers]

  /customer-rfq/{id}:
    get:
      operationId: getCustomerRfq
      tags: [customer-rfq]
      summary: Get customer RFQ with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer RFQ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerRfqDetail"
        "404":
          description: Not found
    patch:
      operationId: updateCustomerRfq
      tags: [customer-rfq]
      summary: Update a draft customer RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRfqUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerRfqDetail"
    delete:
      operationId: deleteCustomerRfq
      tags: [customer-rfq]
      summary: Delete customer RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # CUSTOMER PO
  /customer-po:
    get:
      operationId: listCustomerPos
      tags: [customer-po]
      summary: List customer POs with optional search
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of customer POs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerPo"
    post:
      operationId: createCustomerPo
      tags: [customer-po]
      summary: Create a customer PO (auto-generates the internal number)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPo"
        "400":
          description: Validation error

  /customer-po/customer-rfqs:
    get:
      operationId: listCustomerPosCustomerRfqs
      tags: [customer-po]
      summary: Light list of customer RFQs for the customer-PO picker
      responses:
        "200":
          description: List of customer RFQs
          content:
            application/json:
              schema:
                type: object
                properties:
                  rfqs:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerPoCustomerRfqOption"
                required: [rfqs]

  /customer-po/{id}:
    get:
      operationId: getCustomerPo
      tags: [customer-po]
      summary: Get customer PO with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer PO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPoDetail"
        "404":
          description: Not found
    patch:
      operationId: updateCustomerPo
      tags: [customer-po]
      summary: Update a draft customer PO (or finalize → sent)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPoDetail"
        "400":
          description: PO is not a draft or validation failed
        "404":
          description: Not found
    delete:
      operationId: deleteCustomerPo
      tags: [customer-po]
      summary: Delete a draft customer PO
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: PO is not a draft (already sent)
        "404":
          description: Not found

  # ERP INTEGRATIONS
  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: "قائمة تكاملات الـ ERP"
      responses:
        "200":
          description: قائمة التكاملات
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErpIntegration"
    post:
      operationId: createIntegration
      tags: [integrations]
      summary: "إنشاء تكامل جديد"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErpIntegrationInput"
      responses:
        "201":
          description: تم الإنشاء
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErpIntegration"

  /integrations/{id}:
    get:
      operationId: getIntegration
      tags: [integrations]
      summary: "تفاصيل تكامل"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: التكامل
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErpIntegration"
    patch:
      operationId: updateIntegration
      tags: [integrations]
      summary: "تعديل تكامل"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErpIntegrationInput"
      responses:
        "200":
          description: تم التعديل
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErpIntegration"
    delete:
      operationId: deleteIntegration
      tags: [integrations]
      summary: "حذف تكامل"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: تم الحذف

  /integrations/{id}/test:
    post:
      operationId: testIntegrationConnection
      tags: [integrations]
      summary: "اختبار الاتصال بالـ ERP"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: نتيجة الاختبار
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErpConnectionTestResult"

  /integrations/{id}/sync:
    post:
      operationId: syncIntegration
      tags: [integrations]
      summary: "تشغيل مزامنة كاملة (في الخلفية)"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: بدأت المزامنة
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  integrationId:
                    type: integer

  /integrations/{id}/sync-suppliers:
    post:
      operationId: syncIntegrationSuppliers
      tags: [integrations]
      summary: "استيراد الموردين من الـ ERP"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: نتيجة الاستيراد
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErpSyncResult"

  /integrations/{id}/export:
    post:
      operationId: exportToIntegration
      tags: [integrations]
      summary: "تصدير البيانات للـ ERP"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: نتيجة التصدير
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErpSyncResult"

  # RFQ
  /rfq:
    get:
      operationId: listRfqs
      tags: [rfq]
      summary: List all RFQs
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: employeeId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of RFQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rfq"
    post:
      operationId: createRfq
      tags: [rfq]
      summary: Create a new RFQ from customer RFQ number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"

  /rfq/{id}:
    get:
      operationId: getRfq
      tags: [rfq]
      summary: Get RFQ by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: RFQ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"
    patch:
      operationId: updateRfq
      tags: [rfq]
      summary: Update RFQ status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"

  /rfq/{id}/items:
    get:
      operationId: listRfqItems
      tags: [rfq]
      summary: Get items for an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: RFQ items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RfqItem"

  /rfq/{id}/send:
    post:
      operationId: sendRfqToSuppliers
      tags: [rfq]
      summary: Send RFQ to selected suppliers via email
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRfqInput"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendRfqResult"

  /rfq/{id}/sent-log:
    get:
      operationId: getRfqSentLog
      tags: [rfq]
      summary: Get sent log for an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sent log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SentLogEntry"

  /rfq/{id}/offers:
    get:
      operationId: getRfqOffers
      tags: [rfq]
      summary: Get all offers for an RFQ with price analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Offers with analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqOffersResponse"

  /offers/items/{offerItemId}/approve:
    patch:
      operationId: approveOfferItem
      tags: [offers]
      summary: Approve (endorse) a supplier price for an rfq_item — only one approved price per rfq_item.
      parameters:
        - name: offerItemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approved:
                  type: boolean
      responses:
        "200":
          description: Approval toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  isApproved:
                    type: boolean

  /rfq/lookup/{customerRfqNo}:
    get:
      operationId: lookupCustomerRfq
      tags: [rfq]
      summary: Lookup items from customer RFQ number (reads Google Sheets DATA sheet)
      parameters:
        - name: customerRfqNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer RFQ items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerRfqItem"

  # PURCHASE ORDERS
  /po:
    get:
      operationId: listPurchaseOrders
      tags: [po]
      summary: List all purchase orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of purchase orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
    post:
      operationId: createPurchaseOrder
      tags: [po]
      summary: Create a new purchase order from a sheet PO number, with per-item supplier assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /po/{id}:
    get:
      operationId: getPurchaseOrder
      tags: [po]
      summary: Get purchase order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
    put:
      operationId: updatePurchaseOrder
      tags: [po]
      summary: Update a DRAFT purchase order (PO-level fields + full items replacement)
      description: |
        Only purchase orders still in "draft" status may be edited. Once a PO is
        dispatched ("sent") it is locked. The supplied `items` array fully replaces
        the existing items, so add/edit/remove are all handled by sending the new list.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderUpdateInput"
      responses:
        "200":
          description: Updated purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "400":
          description: PO is not a draft or validation failed
        "404":
          description: Purchase order not found
    delete:
      operationId: deletePurchaseOrder
      tags: [po]
      summary: Delete a DRAFT purchase order and all its line items
      description: |
        Only purchase orders still in "draft" status may be deleted. Once a PO is
        dispatched ("sent") it is locked and cannot be removed. Deleting a draft PO
        also removes its line items and any work-order assignments in a single
        transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchase order deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
        "400":
          description: PO is not a draft (already sent)
        "404":
          description: Purchase order not found

  /po/{id}/items:
    get:
      operationId: listPurchaseOrderItems
      tags: [po]
      summary: Get items for a purchase order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchase order items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrderItem"

  /po/lookup/{poNo}:
    get:
      operationId: lookupPoFromSheet
      tags: [po]
      summary: Lookup items from a purchase order number (reads Google Sheets DATA sheet, column K)
      parameters:
        - name: poNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Purchase order items from sheet
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SheetPoItem"

  /po/sheets/po-numbers:
    get:
      operationId: listSheetPoNumbers
      tags: [po]
      summary: List unique purchase order numbers found in the sheet (column K)
      parameters:
        - name: sheet
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Purchase order numbers
          content:
            application/json:
              schema:
                type: object
                required: [poNumbers]
                properties:
                  poNumbers:
                    type: array
                    items:
                      type: string

  # PRICING TOKEN (Supplier Portal)
  /pricing/{token}:
    get:
      operationId: getPricingPage
      tags: [offers]
      summary: Get pricing page data by token (public - for suppliers)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pricing page data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingPageData"
        "404":
          description: Token not found or expired

  /pricing/{token}/submit:
    post:
      operationId: submitOffer
      tags: [offers]
      summary: Submit offer via pricing token (public - for suppliers)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferInput"
      responses:
        "201":
          description: Offer submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "400":
          description: Token expired or invalid

  /pricing/{token}/track:
    post:
      operationId: trackLinkOpen
      tags: [offers]
      summary: Track when supplier opens the pricing link
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tracked

  # ITEMS SEARCH
  /items/search:
    get:
      operationId: searchItems
      tags: [rfq]
      summary: Search items across all RFQs by description, part number, or line item
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemHistory"

  # OFFERS
  /offers:
    get:
      operationId: listOffers
      tags: [offers]
      summary: List all offers
      parameters:
        - name: rfqId
          in: query
          schema:
            type: integer
        - name: supplierId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offer"

  # ANALYTICS
  /analytics/dashboard:
    get:
      operationId: getDashboardStats
      tags: [analytics]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /analytics/employee/{id}:
    get:
      operationId: getEmployeePerformance
      tags: [analytics]
      summary: Get employee performance metrics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePerformance"

  /analytics/price-analysis/{rfqId}:
    get:
      operationId: getPriceAnalysis
      tags: [analytics]
      summary: Price analysis for an RFQ - compare offers, detect anomalies
      parameters:
        - name: rfqId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Price analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceAnalysis"


  /analytics/reports:
    get:
      operationId: getReports
      tags: [analytics]
      summary: 'تقارير شاملة مع فلترة بالتاريخ'
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: 'تاريخ البداية (YYYY-MM-DD)'
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: 'تاريخ النهاية (YYYY-MM-DD)'
      responses:
        '200':
          description: تقارير تفصيلية
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsData'

  # AUDIT LOG
  /audit:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries
      parameters:
        - name: rfqId
          in: query
          schema:
            type: integer
        - name: employeeId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # AUTH
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [employee, token]
      properties:
        employee:
          $ref: "#/components/schemas/Employee"
        token:
          type: string

    Employee:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, manager, purchasing]
        phone:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    EmployeeInput:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, manager, purchasing]
        phone:
          type: string

    EmployeeUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, manager, purchasing]
        phone:
          type: string
        isActive:
          type: boolean
        password:
          type: string

    # CATEGORIES
    SupplierCategory:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    # SUPPLIERS
    Supplier:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: integer
        supplierId:
          type: string
        name:
          type: string
        contactPerson:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        category:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string

    SupplierInput:
      type: object
      required: [name, category]
      properties:
        supplierId:
          type: string
        name:
          type: string
        contactPerson:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        category:
          type: string

    SupplierUpdate:
      type: object
      properties:
        name:
          type: string
        contactPerson:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        category:
          type: string
        isActive:
          type: boolean

    # CUSTOMERS
    Customer:
      type: object
      required: [id, name, isActive]
      properties:
        id:
          type: integer
        customerId:
          type: ["string", "null"]
        name:
          type: string
        nickname:
          type: ["string", "null"]
        contactPerson:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        taxId:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    CustomerInput:
      type: object
      required: [name, phone, address]
      properties:
        customerId:
          type: string
        name:
          type: string
        nickname:
          type: string
        contactPerson:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        taxId:
          type: string
        notes:
          type: string

    CustomerUpdate:
      type: object
      properties:
        customerId:
          type: string
        name:
          type: string
        nickname:
          type: string
        contactPerson:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        taxId:
          type: string
        notes:
          type: string
        isActive:
          type: boolean

    CustomerRfq:
      type: object
      required: [id, internalNo, customerName, customerRfqNo, numberAutoGenerated, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        internalNo:
          type: string
        customerId:
          type: ["integer", "null"]
        customerName:
          type: string
        customerRfqNo:
          type: string
        numberAutoGenerated:
          type: boolean
          description: True when the customer RFQ number was auto-generated (left blank by the user)
        entryDate:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
        buyerName:
          type: ["string", "null"]
        employeeId:
          type: ["integer", "null"]
          description: Employee who entered the RFQ (auto from session)
        employeeName:
          type: ["string", "null"]
          description: Name of the employee who entered the RFQ
        status:
          type: string
        notes:
          type: ["string", "null"]
        itemCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    CustomerRfqLineItemInput:
      type: object
      properties:
        partNo:
          type: string
        lineItem:
          type: string
          description: Spaces are stripped automatically by the server
        description:
          type: string
          description: Item description / توصيف البند
        uom:
          type: string
        qty:
          type: number
        unitPrice:
          type: number
          description: Unit price entered after the RFQ is saved (required to finalize)

    CustomerRfqLineItem:
      type: object
      required: [id, customerRfqId, createdAt]
      properties:
        id:
          type: integer
        customerRfqId:
          type: integer
        partNo:
          type: ["string", "null"]
        lineItem:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        uom:
          type: ["string", "null"]
        qty:
          type: ["number", "null"]
        unitPrice:
          type: ["number", "null"]
        total:
          type: ["number", "null"]
          description: qty * unitPrice, computed by the server
        createdAt:
          type: string

    CustomerRfqInput:
      type: object
      required: [customerName]
      properties:
        customerId:
          type: ["integer", "null"]
        customerName:
          type: string
        customerRfqNo:
          type: string
          description: Optional — auto-generated when blank (numberAutoGenerated becomes true)
        entryDate:
          type: string
        expiryDate:
          type: string
        buyerName:
          type: string
        notes:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerRfqLineItemInput"

    CustomerRfqUpdate:
      type: object
      properties:
        customerName:
          type: string
        customerRfqNo:
          type: string
        entryDate:
          type: string
        expiryDate:
          type: string
        buyerName:
          type: string
        notes:
          type: string
        status:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerRfqLineItemInput"
        overrideMarginCheck:
          type: boolean
          description: Admin-only — bypass the 1.06× margin check on finalize (audited).

    CustomerRfqDetail:
      allOf:
        - $ref: "#/components/schemas/CustomerRfq"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CustomerRfqLineItem"

    # ── Customer PO ──────────────────────────────────────────────────────────
    CustomerPo:
      type: object
      required: [id, internalPoNo, customerPoNo, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        internalPoNo:
          type: string
          description: Auto-generated internal number (CPO-YYYY-NNNNNN)
        customerPoNo:
          type: string
          description: PO number received from the customer
        customerId:
          type: ["integer", "null"]
          description: The owning customer (explicitly selected on entry)
        customerName:
          type: ["string", "null"]
          description: The owning customer's name (stored, not derived)
        poDate:
          type: ["string", "null"]
        buyerName:
          type: ["string", "null"]
          description: The customer's buyer/contact reference (separate from the entering employee)
        employeeId:
          type: ["integer", "null"]
          description: Employee who entered the PO (auto from session)
        employeeName:
          type: ["string", "null"]
        status:
          type: string
        notes:
          type: ["string", "null"]
        itemCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    CustomerPoCustomerRfqOption:
      type: object
      required: [id, customerRfqNo, internalNo, customerName, status]
      properties:
        id:
          type: integer
        customerRfqNo:
          type: string
        internalNo:
          type: string
        customerName:
          type: string
        status:
          type: string

    CustomerPoLineItemInput:
      type: object
      properties:
        customerRfqId:
          type: ["integer", "null"]
          description: The customer RFQ this line was sourced from (null for free/manual lines)
        customerRfqItemId:
          type: ["integer", "null"]
          description: The specific customer RFQ line item. Not unique — the same item may be ordered again on a later PO.
        partNo:
          type: string
        lineItem:
          type: string
          description: Spaces are stripped automatically by the server
        description:
          type: string
        uom:
          type: string
        qty:
          type: number
        unitPrice:
          type: number
        deliveryDate:
          type: string
          description: Required delivery date for this line

    CustomerPoLineItem:
      type: object
      required: [id, customerPoId, createdAt]
      properties:
        id:
          type: integer
        customerPoId:
          type: integer
        customerRfqId:
          type: ["integer", "null"]
        customerRfqItemId:
          type: ["integer", "null"]
        customerRfqNo:
          type: ["string", "null"]
          description: The customer RFQ number linked to this item (resolved by the server)
        partNo:
          type: ["string", "null"]
        lineItem:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        uom:
          type: ["string", "null"]
        qty:
          type: ["number", "null"]
        unitPrice:
          type: ["number", "null"]
        total:
          type: ["number", "null"]
          description: qty * unitPrice, computed by the server
        deliveryDate:
          type: ["string", "null"]
        createdAt:
          type: string

    CustomerPoInput:
      type: object
      required: [customerPoNo, customerName, items]
      properties:
        customerPoNo:
          type: string
        customerId:
          type: ["integer", "null"]
        customerName:
          type: string
          description: The owning customer's name (explicitly selected/typed)
        poDate:
          type: string
        buyerName:
          type: string
          description: Optional customer-side buyer/contact reference
        notes:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerPoLineItemInput"

    CustomerPoUpdate:
      type: object
      properties:
        customerPoNo:
          type: string
        customerId:
          type: ["integer", "null"]
        customerName:
          type: string
        poDate:
          type: string
        buyerName:
          type: string
        notes:
          type: string
        status:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerPoLineItemInput"

    CustomerPoDetail:
      allOf:
        - $ref: "#/components/schemas/CustomerPo"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CustomerPoLineItem"

    BulkImportSuppliersInput:
      type: object
      required: [suppliers]
      properties:
        suppliers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SupplierInput"

    BulkImportSuppliersResult:
      type: object
      required: [imported, skipped, errors]
      properties:
        imported:
          type: integer
          description: "عدد الموردين الذين تمت إضافتهم بنجاح"
        skipped:
          type: integer
          description: "عدد الموردين الذين تخطيناهم (مكررين)"
        errors:
          type: integer
          description: "عدد الموردين الذين فشل استيرادهم"
        details:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              name:
                type: string
              status:
                type: string
                enum: [imported, skipped, error]
              reason:
                type: ["string", "null"]
              supplier:
                $ref: "#/components/schemas/Supplier"

    SupplierScore:
      type: object
      required: [supplierId, totalScore, rating]
      properties:
        supplierId:
          type: integer
        supplierName:
          type: string
        # الدرجة الإجمالية والتقييم
        totalScore:
          type: number
          description: "الدرجة الإجمالية (0-100)"
        rating:
          type: number
          description: "التقييم بالنجوم (0-5)"
        # درجات المعاملات الفردية (0-100 لكل منها)
        responseSpeedScore:
          type: number
          description: "سرعة الرد (0-100)"
        commitmentScore:
          type: number
          description: "الالتزام — نسبة الاستجابة (0-100)"
        priceScore:
          type: number
          description: "السعر — مقارنةً بمتوسط السوق (0-100)"
        qualityScore:
          type: number
          description: "جودة المنتج — نسبة الفوز (0-100)"
        deliveryScore:
          type: number
          description: "مدة التوريد (0-100)"
        # إحصاءات مفصّلة
        totalRfqsReceived:
          type: integer
          description: "إجمالي طلبات عروض الأسعار المستلمة"
        totalOffersSubmitted:
          type: integer
          description: "إجمالي العروض المقدمة"
        responseRate:
          type: number
          description: "نسبة الاستجابة (%)"
        avgResponseHours:
          type: ["number", "null"]
          description: "متوسط ساعات الرد على الطلب"
        wins:
          type: integer
          description: "عدد مرات الفوز (بنود أوامر الشراء)"
        rejections:
          type: integer
          description: "عدد مرات الرفض (قدّم عرضاً ولم يُختر)"
        avgDeliveryDays:
          type: ["integer", "null"]
          description: "متوسط مدة التوريد بالأيام"
        avgPriceDelta:
          type: number
          description: "متوسط انحراف السعر عن متوسط السوق (%)"
        # للتوافق مع الحقول القديمة
        responseRateScore:
          type: number
        onTimeScore:
          type: number

    # RFQ
    Rfq:
      type: object
      required: [id, internalRfqNo, customerRfqNo, status, createdAt]
      properties:
        id:
          type: integer
        internalRfqNo:
          type: string
        customerRfqNo:
          type: string
        customerRfqDate:
          type: ["string", "null"]
        requiredResponseDate:
          type: ["string", "null"]
        status:
          type: string
          enum: [DRAFT, SENT, QUOTED, FAILED, SUCCESS]
