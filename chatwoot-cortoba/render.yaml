# Chatwoot (agent console) on Render.
#
# Topology — four resources, and NOTHING here touches the existing cortoba-rfq
# service or its database:
#
#   cortoba-chatwoot         web service   (Puma)  — the console UI + API
#   cortoba-chatwoot-worker  worker        (Sidekiq) — webhooks, imports, jobs
#   cortoba-chatwoot-redis   Key Value     — Sidekiq queue + Rails cache
#   cortoba-chatwoot-db      Postgres 16   — Chatwoot's OWN database
#
# `pgvector` is REQUIRED (upstream `db/schema.rb` runs `enable_extension
# "vector"`), and Render's managed Postgres ships it — verified against the live
# instance (`vector 0.8.7` in `pg_available_extensions`) before this file was
# written. A plain Postgres without it fails at `db:chatwoot_prepare` with
# `extension "vector" is not available`.
#
# Chatwoot is wired to Cortoba on an **API inbox**. It is never configured as a
# WhatsApp channel: the app's own Meta webhook stays the ONE gateway to
# WhatsApp, because pointing Meta at Chatwoot would silently stop RFQ sending,
# PO dispatch and the representative bot.
#
# Secrets are `sync: false` — Render prompts for them and they are never stored
# in this file. Deploy order: create the resources, then set the six
# CHATWOOT_* vars on the cortoba-rfq service (see README).

services:
  - type: web
    name: cortoba-chatwoot
    runtime: docker
    repo: https://github.com/melsofany/Rfq-Manager
    branch: feat/supplier-bot-and-chatwoot-install
    dockerfilePath: ./chatwoot-cortoba/Dockerfile
    dockerContext: ./chatwoot-cortoba
    region: oregon
    # 1 CPU / 2 GB. NOT `starter` — that is a legacy alias for
    # 0.5c-512mb, and Chatwoot's web process measures ~437 MB, which
    # leaves no headroom on 512 MB (measured, not assumed).
    plan: 1c-2g
    healthCheckPath: /health
    # `preDeployCommand` gates the deploy on a successful migration when Render
    # supports it on this service type. The design does NOT depend on it: the web
    # entrypoint migrates too, and a second run against a prepared schema is a
    # fast no-op. Either way a green deploy means the schema is really there,
    # because the script fails non-zero when it is not.
    preDeployCommand: sh /app/bin/entrypoint.sh migrate
    # The ONE migrator. The worker waits for this service's schema rather than
    # migrating itself (two concurrent migrators race on a fresh database).
    dockerCommand: sh /app/bin/entrypoint.sh web
    # Chatwoot's `local` storage writes to /app/storage (config/storage.yml).
    # Without a disk that path is on the ephemeral container filesystem, so an
    # agent's uploaded PDF disappears on the next deploy. $0.25/GB per month.
    #
    # A Render disk attaches to ONE service, so the worker cannot share it. That
    # is acceptable here because the files that matter — a supplier's price
    # attachment — are stored in Cortoba's Postgres, not in Chatwoot. For a
    # shared, multi-service store, point ACTIVE_STORAGE_SERVICE at S3 instead
    # (Chatwoot supports it natively; it needs a bucket and keys, see README).
    disk:
      name: chatwoot-storage
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: INSTALLATION_ENV
        value: docker
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_LOG_LEVEL
        value: info
      # Render terminates TLS in front of us, so the session cookie must be
      # marked secure or the login redirect bounces.
      - key: FORCE_SSL
        value: "true"
      # Employees sign in to Cortoba only; they never get a Chatwoot password.
      - key: ENABLE_ACCOUNT_SIGNUP
        value: "false"
      - key: DISABLE_TELEMETRY
        value: "true"
      - key: DEFAULT_LOCALE
        value: ar
      # Attachments an AGENT uploads from the console. Supplier attachments are
      # NOT here — the bridge mirrors text only, and inbound WhatsApp media is
      # stored in Cortoba's own Postgres (`whatsapp_media`), so the canonical
      # supplier files never depend on this service. This covers the console
      # side, and `disks:` below makes it survive a re-deploy.
      - key: ACTIVE_STORAGE_SERVICE
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: cortoba-chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cortoba-chatwoot-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://cortoba-chatwoot.onrender.com
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: CORTOBA_APP_URL
        value: https://cortoba-rfq.onrender.com
      - key: CORTOBA_RFQ_ATTRIBUTE_KEY
        value: cortoba_rfq_no
      - key: CORTOBA_OWNER_ATTRIBUTE_KEY
        value: cortoba_owner_name

  - type: worker
    name: cortoba-chatwoot-worker
    runtime: docker
    repo: https://github.com/melsofany/Rfq-Manager
    branch: feat/supplier-bot-and-chatwoot-install
    dockerfilePath: ./chatwoot-cortoba/Dockerfile
    dockerContext: ./chatwoot-cortoba
    region: oregon
    # 1 CPU / 2 GB, same reason: the worker measured ~432-471 MB and
    # does not shrink with SIDEKIQ_CONCURRENCY — the Rails baseline
    # dominates.
    plan: 1c-2g
    dockerCommand: sh /app/bin/entrypoint.sh worker
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: INSTALLATION_ENV
        value: docker
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_LOG_LEVEL
        value: info
      - key: ENABLE_ACCOUNT_SIGNUP
        value: "false"
      - key: DISABLE_TELEMETRY
        value: "true"
      - key: DEFAULT_LOCALE
        value: ar
      - key: ACTIVE_STORAGE_SERVICE
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: cortoba-chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cortoba-chatwoot-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://cortoba-chatwoot.onrender.com
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: cortoba-chatwoot
          envVarKey: SECRET_KEY_BASE
      - key: CORTOBA_APP_URL
        value: https://cortoba-rfq.onrender.com
      - key: CORTOBA_RFQ_ATTRIBUTE_KEY
        value: cortoba_rfq_no
      - key: CORTOBA_OWNER_ATTRIBUTE_KEY
        value: cortoba_owner_name

  - type: keyvalue
    name: cortoba-chatwoot-redis
    region: oregon
    # Disk-backed persistence. The free 25 MB tier has none, so a restart would
    # drop queued Sidekiq jobs.
    plan: 256mb
    # Sidekiq jobs must survive a restart; without persistence a queued webhook
    # is lost and the conversation it belonged to is never created.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: cortoba-chatwoot-db
    databaseName: chatwoot
    user: chatwoot
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: "16"
